name: Build xraybagram
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'
      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios
      - name: Build xraybagram IPA
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR
          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 100)
          export BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts"
          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          mkdir -p "$OUTPUT_PATH"
          if [ -f "$OUTPUT_PATH/Swiftgram.ipa" ]; then
            mv "$OUTPUT_PATH/Swiftgram.ipa" "$OUTPUT_PATH/xraybagram.ipa"
          fi
          for f in $(find bazel-bin bazel-out -name "*.ipa" 2>/dev/null); do
            echo "Found IPA: $f"
            mv "$f" "$OUTPUT_PATH/xraybagram.ipa"
          done
      - name: Upload xraybagram IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xraybagram-iOS-${{ env.APP_VERSION }}
          path: /Users/Shared/telegram-ios/build/artifacts/xraybagram.ipa
          if-no-files-found: warn
